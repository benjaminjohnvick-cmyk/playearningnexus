# Codemagic CI — build & sign the Capacitor iOS app with NO Mac, upload to TestFlight.
# Copy to the REPO ROOT as `codemagic.yaml`. Set up the App Store Connect integration named
# `CodemagicASC` in the Codemagic UI first (Teams → Integrations → App Store Connect).
# Free tier: 500 macOS M2 minutes/month — enough to launch and iterate.

workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicASC
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.playearningnexus.app"
        APP_STORE_APPLE_ID: 0000000000   # <-- your app's Apple ID from App Store Connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.playearningnexus.app"
    scripts:
      - name: Install dependencies & build the web app
        script: |
          npm install --ignore-scripts
          npm run build
      - name: Add & sync Capacitor iOS
        script: |
          npx cap add ios 2>/dev/null || echo "ios/ already present"
          npx cap sync ios
          node scripts/inject-native-permissions.mjs   # NSContactsUsageDescription (contact-invite)
      - name: Set up code signing (managed by Codemagic)
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip to true once TestFlight looks good

  android-capacitor:
    name: Android Capacitor Build
    instance_type: linux_x2      # Android builds on Linux — cheaper/faster than Mac
    max_build_duration: 60
    environment:
      node: 20
      java: 21
      groups:
        - google_play            # in Codemagic UI, add this group with:
                                 #   CM_KEYSTORE (upload keystore file, base64),
                                 #   CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.playearningnexus.app"
    scripts:
      - name: Install dependencies & build the web app
        script: |
          npm install --ignore-scripts
          npm run build
      - name: Add & sync Capacitor Android
        script: |
          npx cap add android 2>/dev/null || echo "android/ already present"
          npx cap sync android
          node scripts/inject-native-permissions.mjs   # READ_CONTACTS (contact-invite)
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/upload.keystore
      - name: Build signed AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/upload.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # Play service-account JSON, added in Codemagic UI
        track: internal
        submit_as_draft: true
