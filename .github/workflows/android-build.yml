# GitHub Actions — build & (optionally) sign the Capacitor Android app bundle (.aab) in the cloud.
# No Android Studio, no local machine needed — Android builds on a free Linux runner.
#
# ── HOW THIS RUNS ──────────────────────────────────────────────────────────────────────────────
# MANUAL ONLY. This workflow does NOT run on pushes — it only runs when you start it yourself from
# the Actions tab (Actions → "Android Build & Play" → "Run workflow"). That's deliberate: the repo is
# wrapper-only (the android/ project is regenerated at build time and there's no signing keystore yet),
# so there is nothing for an automatic build to accomplish, and an automatic build would just email you
# a failure on every push. Run it by hand when you actually want an .aab.
#
# ── Optional repo Secrets for a Play-ready SIGNED build (Settings → Secrets and variables → Actions) ──
#   ANDROID_KEYSTORE_BASE64  - your upload keystore, base64-encoded (see one-time step below)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   (optional) PLAY_SERVICE_ACCOUNT_JSON - Google Play service-account JSON to auto-upload
# With NO secrets set, the run still succeeds and produces a downloadable UNSIGNED .aab.
#
# ── ONE-TIME: create the upload keystore (runs on ANY machine with a JDK — no Android Studio) ──
#   keytool -genkeypair -v -keystore upload.keystore -alias upload \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 upload.keystore   # copy the output into the ANDROID_KEYSTORE_BASE64 secret
#   (On macOS use `base64 -b0`. Back up upload.keystore — you need it for every future update.)

name: Android Build & Play

on:
  workflow_dispatch:          # MANUAL ONLY — start it from the Actions tab. No push triggers.

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps & build web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Add & sync Capacitor Android
        run: |
          npx cap add android 2>/dev/null || echo "android/ already present"
          npx cap sync android

      - name: Auto-bump build number (from the CI run number)
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode [0-9][0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
            echo "Set Android versionCode to ${GITHUB_RUN_NUMBER}"
          fi

      # Detect whether the signing keystore secret is configured. If it isn't, we still build a
      # downloadable UNSIGNED bundle instead of hard-failing the whole run (mirrors the Deploy workflow,
      # which skips gracefully when its secrets aren't wired yet).
      - name: Check for signing keystore
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned Android build::No ANDROID_KEYSTORE_BASE64 secret set, so this run builds an UNSIGNED .aab you can download from the run's Artifacts. To produce a Play-ready SIGNED bundle (and optional auto-publish), add the ANDROID_KEYSTORE_* secrets described at the top of this workflow file."
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > $RUNNER_TEMP/upload.keystore

      - name: Build SIGNED AAB (release)
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build UNSIGNED AAB (release) — no keystore configured
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload the .aab as a build artifact (download & submit manually if you prefer)
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ── OPTIONAL: auto-publish to Google Play (needs a SIGNED build + PLAY_SERVICE_ACCOUNT_JSON + the app
      #    already created once in Play Console). Skipped automatically unless both are present. ──
      - name: Publish to Google Play (internal track)
        if: ${{ steps.signing.outputs.ready == 'true' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.playearningnexus.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
