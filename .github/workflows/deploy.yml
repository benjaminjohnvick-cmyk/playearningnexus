# Continuous Integration — GamerGain / PlayEarning Nexus
#
# WHAT IT DOES (automatically, on every push to main):
#   1. VALIDATE  — builds the frontend and runs the full pre-deploy audit (entities<->schema,
#                  scheduler<->functions, manifest). Fails fast if anything drifted.
#   2. SMOKE     — runs the automated QA pass against the live backend (only if BACKEND_URL is set).
#
# DEPLOY is handled by Railway's native GitHub integration: the "getgreen" service auto-builds the
# frontend from deploy-kit/railway/frontend.Dockerfile on every push to main. That is the live deploy,
# so this workflow no longer runs a separate Railway CLI deploy (it was redundant with Railway's own
# integration and double-built the service). No RAILWAY_TOKEN / RAILWAY_SERVICE is needed here anymore.
#
# ONE-TIME HUMAN SETUP (optional; GitHub -> Settings -> Secrets and variables -> Actions):
#   • Variable BACKEND_URL — your deployed backend URL (enables the post-deploy smoke test).
# Without it, the workflow still runs VALIDATE and simply SKIPS the smoke test with a notice — it never
# hard-fails for someone who hasn't wired it yet. Nothing here can charge a card or touch money.

name: Deploy (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
      - 'deploy-kit/validate.sh'
      - 'deploy-kit/e2e-smoke.mjs'
  workflow_dispatch:   # also runnable by one click from the Actions tab

jobs:
  validate:
    name: Validate build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install + build + full pre-deploy audit
        run: bash deploy-kit/validate.sh
      - name: Automated code auditor (structural checks + guardrail lints)
        run: node deploy-kit/audit.mjs
        # Structural errors fail the build. Guardrail lints are advisory (printed for review).
        # To also block on advisory warnings once clean, change to: node deploy-kit/audit.mjs --strict

  smoke:
    name: Automated QA smoke (live)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for BACKEND_URL
        id: guard
        run: |
          if [ -n "${{ vars.BACKEND_URL }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Smoke skipped::Set a BACKEND_URL variable (Settings -> Variables -> Actions) to run the live QA smoke after deploy."
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: Run automated QA pass against the live backend
        if: steps.guard.outputs.ready == 'true'
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: node deploy-kit/e2e-smoke.mjs
