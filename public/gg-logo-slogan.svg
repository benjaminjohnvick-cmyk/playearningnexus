<svg xmlns="http://www.w3.org/2000/svg" width="560" height="108" viewBox="0 0 560 108" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="nA" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#16264f"/><stop offset="1" stop-color="#0a142e"/></linearGradient>
    <linearGradient id="gdA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e2a6"/><stop offset="0.5" stop-color="#e8c766"/><stop offset="1" stop-color="#b9942f"/></linearGradient>
  </defs>
  <!-- G-cubed mark -->
  <g transform="translate(4,7) scale(0.82)">
    <rect x="6" y="6" width="88" height="88" rx="16" fill="url(#nA)" stroke="url(#gdA)" stroke-width="3"/>
    <rect x="12" y="12" width="76" height="76" rx="11" fill="none" stroke="#e8c766" stroke-width="1" opacity="0.5"/>
    <text x="45" y="66" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="46" fill="url(#gdA)">G</text>
    <text x="71" y="42" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#f4e2a6">3</text>
  </g>
  <!-- Wordmark -->
  <text x="104" y="46" font-size="29" font-weight="800" fill="#0a142e">Get Goods Gratis (Free)<tspan font-size="12" dy="-14" fill="#0a142e">™</tspan></text>
  <!-- Slogan (brand tagline) -->
  <text x="105" y="74" font-size="15" font-weight="700" letter-spacing="2.5" fill="#b9942f">WHERE GLOBAL GOODS GATHER</text>
  <!-- Descriptor (unregistered marketing line) -->
  <text x="105" y="95" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5a6b8c">Buy Anything Available Online</text>
</svg>
